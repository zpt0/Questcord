name: Release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to release (e.g. v1.0.0)"
                required: true
                type: string
            notes:
                description: "Where the release notes come from"
                required: false
                default: auto
                type: choice
                options: ["auto", "file", "changelog", "commits"]
            prerelease:
                description: "Publish as a prerelease"
                required: false
                default: auto
                type: choice
                options: ["auto", "true", "false"]

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Resolve tag
              id: tag
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    TAG="${{ inputs.tag }}"
                  else
                    TAG="${GITHUB_REF#refs/tags/}"
                  fi
                  VERSION="${TAG#v}"
                  echo "tag=${TAG}" >> $GITHUB_OUTPUT
                  echo "version=${VERSION}" >> $GITHUB_OUTPUT
                  echo "base_version=${VERSION%%-*}" >> $GITHUB_OUTPUT

            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0
                  ref: ${{ steps.tag.outputs.tag }}

            - name: Validate version match
              run: |
                  TAG_VERSION="${{ steps.tag.outputs.version }}"
                  BASE_VERSION="${{ steps.tag.outputs.base_version }}"
                  PKG_VERSION=$(node -p "require('./package.json').version")
                  if [ "$TAG_VERSION" != "$PKG_VERSION" ] && [ "$BASE_VERSION" != "$PKG_VERSION" ]; then
                    echo "::error::Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
                    exit 1
                  fi

            - name: Check the tag is on main
              env:
                  TAG: ${{ steps.tag.outputs.tag }}
              run: |
                  git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main"
                  if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
                    echo "::error::${TAG} is not on main, refusing to release this tag"
                    exit 1
                  fi

            - name: Build plugin zip
              id: build
              run: |
                  VERSION="${{ steps.tag.outputs.version }}"
                  ZIP_NAME="Questcord-v${VERSION}"
                  STAGING_DIR="Questcord"

                  mkdir -p "${STAGING_DIR}"

                  cp index.tsx settings.ts constants.ts styles.css "${STAGING_DIR}/"

                  for dir in core components ui quests utils; do
                    if [ -d "$dir" ]; then
                      mkdir -p "${STAGING_DIR}/${dir}"
                      find "$dir" \( -name "*.ts" -o -name "*.tsx" -o -name "*.css" \) | while read f; do
                        mkdir -p "${STAGING_DIR}/$(dirname "$f")"
                        cp "$f" "${STAGING_DIR}/$f"
                      done
                    fi
                  done

                  find "${STAGING_DIR}" -name "*.test.ts" -delete
                  find "${STAGING_DIR}" -type d -name "__tests__" -exec rm -rf {} + 2>/dev/null || true

                  zip -r "${ZIP_NAME}.zip" "${STAGING_DIR}"
                  rm -rf "${STAGING_DIR}"

                  echo "zip_name=${ZIP_NAME}.zip" >> $GITHUB_OUTPUT

            - name: Write checksums
              run: |
                  sha256sum "${{ steps.build.outputs.zip_name }}" > SHA256SUMS
                  cat SHA256SUMS

            - name: Generate release notes
              id: notes
              env:
                  TAG: ${{ steps.tag.outputs.tag }}
                  NOTES_SOURCE: ${{ inputs.notes }}
                  PRERELEASE: ${{ inputs.prerelease }}
              run: |
                  if [ ! -f .github/releases/generate-notes.sh ]; then
                    echo "::error::${TAG} predates the release notes tooling, edit that release on GitHub instead"
                    exit 1
                  fi
                  bash .github/releases/generate-notes.sh

            - name: Create GitHub Release
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
              with:
                  name: ${{ steps.notes.outputs.title }}
                  body: ${{ steps.notes.outputs.body }}
                  prerelease: ${{ steps.notes.outputs.prerelease == 'true' }}
                  make_latest: ${{ steps.notes.outputs.prerelease != 'true' }}
                  files: |
                      ${{ steps.build.outputs.zip_name }}
                      SHA256SUMS
                  tag_name: ${{ steps.tag.outputs.tag }}

            - name: Attest the release zip
              uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
              with:
                  subject-path: ${{ steps.build.outputs.zip_name }}
