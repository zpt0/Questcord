name: Release

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Existing stable tag to release (vX.Y.Z)"
                required: true
                type: string

permissions:
    contents: write

concurrency:
    group: release-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.tag || github.ref_name }}
                  fetch-depth: 0
                  fetch-tags: true
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  cache: npm
            - run: npm ci
            - name: Set up tsconfig
              run: cp tsconfig.template.json tsconfig.json
            - name: Verify release tag
              env:
                  TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  set -euo pipefail
                  if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "::error::Tag '$TAG' must match vMAJOR.MINOR.PATCH."
                    exit 1
                  fi
                  git rev-parse --verify "${TAG}^{commit}" >/dev/null
                  PACKAGE_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
                  if [[ "$TAG" != "v${PACKAGE_VERSION}" ]]; then
                    echo "::error::Tag '$TAG' does not match package.json version ${PACKAGE_VERSION}."
                    exit 1
                  fi
                  git fetch origin "+refs/heads/main:refs/remotes/origin/main" --no-tags
                  if ! git merge-base --is-ancestor "${TAG}^{commit}" origin/main; then
                    echo "::error::Tag '$TAG' is not an ancestor of origin/main."
                    exit 1
                  fi
            - name: Validate
              run: |
                  npm run typecheck
                  npm run lint
                  npm run format:check
                  npm test -- --coverage
            - name: Generate release notes
              id: notes
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_KIND: stable
                  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
              run: node .github/scripts/generate-release-notes.mjs
            - name: Build source archive
              run: git archive --format=zip --output "${{ steps.notes.outputs.zip_name }}" "${{ steps.notes.outputs.tag }}"
            - name: Upload source archive
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ steps.notes.outputs.zip_name }}
                  path: ${{ steps.notes.outputs.zip_name }}
                  if-no-files-found: error
            - name: Publish stable release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.notes.outputs.tag }}
                  TITLE: ${{ steps.notes.outputs.title }}
                  ZIP: ${{ steps.notes.outputs.zip_name }}
                  NOTES: ${{ steps.notes.outputs.notes_file }}
              run: |
                  gh release create "$TAG" "$ZIP" \
                    --repo "$GITHUB_REPOSITORY" \
                    --title "$TITLE" \
                    --notes-file "$NOTES" \
                    --verify-tag
            - name: Show release notes
              run: cat "${{ steps.notes.outputs.notes_file }}" >> "$GITHUB_STEP_SUMMARY"
