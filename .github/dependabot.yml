version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
      labels:
          - "dependencies"
      assignees:
          - "zpt0"
      # Never open more than one version-update PR: every dependency of this
      # ecosystem is bundled into the single "all-dependencies" group below.
      open-pull-requests-limit: 1
      groups:
          # All version updates land in one pull request.
          all-dependencies:
              applies-to: version-updates
              patterns:
                  - "*"
          # All security updates land in one pull request.
          all-security-updates:
              applies-to: security-updates
              patterns:
                  - "*"
      ignore:
          # typescript-eslint's peer range is `typescript >=4.8.4 <6.1.0`, so a
          # TypeScript major bump (e.g. 7.x) would only produce a red CI run.
          - dependency-name: "typescript"
            update-types:
                - "version-update:semver-major"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
      labels:
          - "dependencies"
      assignees:
          - "zpt0"
      # Same deal as npm: one pull request for all action bumps. The actions are
      # pinned to commit SHAs, Dependabot updates the SHA and the trailing comment.
      open-pull-requests-limit: 1
      groups:
          all-actions:
              patterns:
                  - "*"
